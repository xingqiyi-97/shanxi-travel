<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>人说山西好风光</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: #e8ede6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 地图容器 */
.map-wrap {
  position: relative;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: #eef2eb;
  overflow: hidden;
}

/* 地图背景 SVG */
.map-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

/* 顶栏 */
.topbar {
  position: relative;
  z-index: 10;
  padding: 52px 20px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-title {
  font-size: 22px;
  font-weight: 800;
  color: #1a2a1a;
  letter-spacing: 1px;
}
.topbar-sub {
  font-size: 12px;
  color: #6b7c6b;
  margin-top: 2px;
}
.topbar-badge {
  background: #4a7c59;
  color: #fff;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 600;
  margin-left: auto;
}

/* 路线容器 */
.route-area {
  position: relative;
  padding: 10px 0 80px;
  z-index: 5;
}

/* 城市卡片 */
.city-row {
  display: flex;
  align-items: flex-start;
  padding: 8px 16px;
  gap: 12px;
  position: relative;
}
.city-row.right {
  flex-direction: row-reverse;
}

/* 路线竖线 */
.route-line {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  background: linear-gradient(to bottom, #4a7c59 0%, #7eb88a 50%, #b8d4be 100%);
  top: 0;
  bottom: 0;
  z-index: 1;
}

/* 城市圆点 */
.city-dot {
  position: absolute;
  left: 50%;
  transform: translate(-50%, 28px);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 3px solid #fff;
  z-index: 3;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
  cursor: pointer;
  transition: transform .2s;
  flex-shrink: 0;
}
.city-dot:hover { transform: translate(-50%, 28px) scale(1.2); }
.dot-datong    { background: #e8754a; }
.dot-xinzhou   { background: #4a9be8; }
.dot-taiyuan   { background: #e8b84a; }
.dot-linfen    { background: #9b4ae8; }
.dot-yuncheng  { background: #e84a6f; }

/* 卡片气泡 */
.city-card {
  background: #fff;
  border-radius: 18px;
  padding: 14px 16px;
  max-width: 180px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  position: relative;
  z-index: 4;
  flex-shrink: 0;
}
.city-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
.city-card.active {
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
  transform: translateY(-2px);
}
.card-name {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 4px;
}
.card-tag {
  display: inline-block;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 600;
  margin-right: 4px;
  margin-bottom: 4px;
}
.tag-food { background: #fff0eb; color: #e8754a; }
.tag-play { background: #ebf4ff; color: #4a7ce8; }
.tag-buy  { background: #f0ebff; color: #7c4ae8; }
.card-hint { font-size: 11px; color: #aaa; margin-top: 4px; }

/* 颜色 */
.name-datong   { color: #e8754a; }
.name-xinzhou  { color: #4a9be8; }
.name-taiyuan  { color: #c89a20; }
.name-linfen   { color: #9b4ae8; }
.name-yuncheng { color: #e84a6f; }

/* 气泡小三角 */
.city-card::after {
  content: '';
  position: absolute;
  top: 30px;
  width: 0; height: 0;
}
.city-row:not(.right) .city-card::after {
  right: -10px;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-left: 10px solid #fff;
}
.city-row.right .city-card::after {
  left: -10px;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-right: 10px solid #fff;
}

/* 间距撑开 */
.spacer { height: 60px; position: relative; }
.spacer:first-child { height: 20px; }

/* 详情抽屉 */
.drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 100;
  backdrop-filter: blur(2px);
}
.drawer-overlay.open { display: block; }

.drawer {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%;
  max-width: 480px;
  background: #fff;
  border-radius: 24px 24px 0 0;
  padding: 0 0 env(safe-area-inset-bottom, 16px);
  z-index: 101;
  transition: transform .35s cubic-bezier(.32,.72,0,1);
  max-height: 85vh;
  overflow-y: auto;
}
.drawer.open { transform: translateX(-50%) translateY(0); }

.drawer-handle {
  width: 40px; height: 4px;
  background: #ddd;
  border-radius: 2px;
  margin: 12px auto 0;
}
.drawer-header {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  background: #fff;
  border-bottom: 1px solid #f0f0f0;
  z-index: 1;
}
.drawer-icon {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.drawer-city-name {
  font-size: 20px;
  font-weight: 800;
}
.drawer-close {
  margin-left: auto;
  width: 30px; height: 30px;
  background: #f5f5f5;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: #666;
  display: flex; align-items: center; justify-content: center;
}
.drawer-body { padding: 16px 20px 24px; }
.section {
  margin-bottom: 20px;
}
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: #888;
  letter-spacing: .5px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #f0f0f0;
}
.item-list { display: flex; flex-direction: column; gap: 8px; }
.item-card {
  background: #f8f9f8;
  border-radius: 12px;
  padding: 10px 14px;
}
.item-name {
  font-size: 14px;
  font-weight: 600;
  color: #1a2a1a;
  margin-bottom: 3px;
}
.item-note {
  font-size: 12px;
  color: #888;
  line-height: 1.5;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: #f0f4f0;
  color: #3a5a3a;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 20px;
  font-weight: 500;
}

/* 底部路线图例 */
.legend {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(8px);
  padding: 10px 16px;
  border-radius: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  z-index: 10;
  max-width: calc(480px - 32px);
  width: calc(100% - 32px);
  justify-content: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: #555;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 10px;
  transition: background .15s;
}
.legend-item:hover { background: #f0f4f0; }
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* 装饰背景格子 */
.map-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(180,200,180,.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(180,200,180,.15) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
/* 装饰路线 */
.deco-road {
  position: absolute;
  background: rgba(200,210,200,.4);
  border-radius: 2px;
  pointer-events: none;
}

/* 距离标注 */
.dist-badge {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,.85);
  border: 1px solid #ddeedd;
  border-radius: 20px;
  font-size: 10px;
  color: #6b8c6b;
  padding: 2px 8px;
  z-index: 4;
  white-space: nowrap;
}
</style>
</head>

function openDrawer(cityKey) {
  var city = CITIES[cityKey];
  document.getElementById('drawerName').textContent = city.name;
  document.getElementById('drawerName').style.color = city.color;
  var icon = document.getElementById('drawerIcon');
  icon.textContent = city.icon;
  icon.style.background = city.bg;

  var body = document.getElementById('drawerBody');
  var html = '';
  city.sections.forEach(function(sec) {
    html += '<div class="section">';
    html += '<div class="section-title">' + sec.title + '</div>';
    if (sec.type === 'items') {
      html += '<div class="item-list">';
      sec.items.forEach(function(item) {
        html += '<div class="item-card">';
        html += '<div class="item-name">' + item.name + '</div>';
        if (item.note) html += '<div class="item-note">' + item.note + '</div>';
        html += '</div>';
      });
      html += '</div>';
    } else if (sec.type === 'chips') {
      html += '<div class="chip-row">';
      sec.items.forEach(function(chip) {
        html += '<div class="chip">' + chip + '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  body.innerHTML = html;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

// 触摸滑动关闭
var startY = 0;
document.getElementById('drawer').addEventListener('touchstart', function(e) {
  startY = e.touches[0].clientY;
});
document.getElementById('drawer').addEventListener('touchend', function(e) {
  var dy = e.changedTouches[0].clientY - startY;
  if (dy > 80 && this.scrollTop <= 0) closeDrawer();
});
</script>
