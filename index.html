<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>人说山西好风光</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: #e8ede6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 地图容器 */
.map-wrap {
  position: relative;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: #eef2eb;
  overflow: hidden;
}

/* 地图背景 SVG */
.map-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

/* 顶栏 */
.topbar {
  position: relative;
  z-index: 10;
  padding: 52px 20px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-title {
  font-size: 22px;
  font-weight: 800;
  color: #1a2a1a;
  letter-spacing: 1px;
}
.topbar-sub {
  font-size: 12px;
  color: #6b7c6b;
  margin-top: 2px;
}
.topbar-badge {
  background: #4a7c59;
  color: #fff;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 20px;
  font-weight: 600;
  margin-left: auto;
}

/* 路线容器 */
.route-area {
  position: relative;
  padding: 10px 0 80px;
  z-index: 5;
}

/* 城市卡片 */
.city-row {
  display: flex;
  align-items: flex-start;
  padding: 8px 16px;
  gap: 12px;
  position: relative;
}
.city-row.right {
  flex-direction: row-reverse;
}

/* 路线竖线 */
.route-line {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  background: linear-gradient(to bottom, #4a7c59 0%, #7eb88a 50%, #b8d4be 100%);
  top: 0;
  bottom: 0;
  z-index: 1;
}

/* 城市圆点 */
.city-dot {
  position: absolute;
  left: 50%;
  transform: translate(-50%, 28px);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 3px solid #fff;
  z-index: 3;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
  cursor: pointer;
  transition: transform .2s;
  flex-shrink: 0;
}
.city-dot:hover { transform: translate(-50%, 28px) scale(1.2); }
.dot-datong    { background: #e8754a; }
.dot-xinzhou   { background: #4a9be8; }
.dot-taiyuan   { background: #e8b84a; }
.dot-linfen    { background: #9b4ae8; }
.dot-yuncheng  { background: #e84a6f; }

/* 卡片气泡 */
.city-card {
  background: #fff;
  border-radius: 18px;
  padding: 14px 16px;
  max-width: 180px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  position: relative;
  z-index: 4;
  flex-shrink: 0;
}
.city-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
.city-card.active {
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
  transform: translateY(-2px);
}
.card-name {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 4px;
}
.card-tag {
  display: inline-block;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 600;
  margin-right: 4px;
  margin-bottom: 4px;
}
.tag-food { background: #fff0eb; color: #e8754a; }
.tag-play { background: #ebf4ff; color: #4a7ce8; }
.tag-buy  { background: #f0ebff; color: #7c4ae8; }
.card-hint { font-size: 11px; color: #aaa; margin-top: 4px; }

/* 颜色 */
.name-datong   { color: #e8754a; }
.name-xinzhou  { color: #4a9be8; }
.name-taiyuan  { color: #c89a20; }
.name-linfen   { color: #9b4ae8; }
.name-yuncheng { color: #e84a6f; }

/* 气泡小三角 */
.city-card::after {
  content: '';
  position: absolute;
  top: 30px;
  width: 0; height: 0;
}
.city-row:not(.right) .city-card::after {
  right: -10px;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-left: 10px solid #fff;
}
.city-row.right .city-card::after {
  left: -10px;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  border-right: 10px solid #fff;
}

/* 间距撑开 */
.spacer { height: 60px; position: relative; }
.spacer:first-child { height: 20px; }

/* 详情抽屉 */
.drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 100;
  backdrop-filter: blur(2px);
}
.drawer-overlay.open { display: block; }

.drawer {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%;
  max-width: 480px;
  background: #fff;
  border-radius: 24px 24px 0 0;
  padding: 0 0 env(safe-area-inset-bottom, 16px);
  z-index: 101;
  transition: transform .35s cubic-bezier(.32,.72,0,1);
  max-height: 85vh;
  overflow-y: auto;
}
.drawer.open { transform: translateX(-50%) translateY(0); }

.drawer-handle {
  width: 40px; height: 4px;
  background: #ddd;
  border-radius: 2px;
  margin: 12px auto 0;
}
.drawer-header {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  background: #fff;
  border-bottom: 1px solid #f0f0f0;
  z-index: 1;
}
.drawer-icon {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.drawer-city-name {
  font-size: 20px;
  font-weight: 800;
}
.drawer-close {
  margin-left: auto;
  width: 30px; height: 30px;
  background: #f5f5f5;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 16px;
  color: #666;
  display: flex; align-items: center; justify-content: center;
}
.drawer-body { padding: 16px 20px 24px; }
.section {
  margin-bottom: 20px;
}
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: #888;
  letter-spacing: .5px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #f0f0f0;
}
.item-list { display: flex; flex-direction: column; gap: 8px; }
.item-card {
  background: #f8f9f8;
  border-radius: 12px;
  padding: 10px 14px;
}
.item-name {
  font-size: 14px;
  font-weight: 600;
  color: #1a2a1a;
  margin-bottom: 3px;
}
.item-note {
  font-size: 12px;
  color: #888;
  line-height: 1.5;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: #f0f4f0;
  color: #3a5a3a;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 20px;
  font-weight: 500;
}

/* 底部路线图例 */
.legend {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(8px);
  padding: 10px 16px;
  border-radius: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  z-index: 10;
  max-width: calc(480px - 32px);
  width: calc(100% - 32px);
  justify-content: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: #555;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 10px;
  transition: background .15s;
}
.legend-item:hover { background: #f0f4f0; }
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* 装饰背景格子 */
.map-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(180,200,180,.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(180,200,180,.15) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
/* 装饰路线 */
.deco-road {
  position: absolute;
  background: rgba(200,210,200,.4);
  border-radius: 2px;
  pointer-events: none;
}

/* 距离标注 */
.dist-badge {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,.85);
  border: 1px solid #ddeedd;
  border-radius: 20px;
  font-size: 10px;
  color: #6b8c6b;
  padding: 2px 8px;
  z-index: 4;
  white-space: nowrap;
}

/* drawer item styles */
.drawer-section-title {
  font-size: 13px;
  font-weight: 700;
  color: #888;
  letter-spacing: .5px;
  margin: 16px 0 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.drawer-section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #f0f0f0;
}
.drawer-item {
  background: #f8f9f8;
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 600;
  color: #1a2a1a;
  margin-bottom: 6px;
}
.item-note {
  display: block;
  font-size: 12px;
  color: #888;
  font-weight: 400;
  margin-top: 3px;
  line-height: 1.5;
}

/* Step 5 mobile */
body { background: #c8b89a; }
.map-wrap { contain: layout; isolation: isolate; }
.route-area { overflow: hidden; }

/* ===== 勾选 / 留言 / AI 行程 新增样式 ===== */
.drawer-item { position: relative; cursor: pointer; user-select: none; }
.drawer-item.checked { background: #e6f4e6; }
.drawer-item .check-icon {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 16px; opacity: 0; transition: opacity .2s;
}
.drawer-item.checked .check-icon { opacity: 1; }

/* 底部 AI 行程按钮 */
.ai-bar {
  position: sticky; bottom: 0;
  background: #fff;
  padding: 12px 16px 20px;
  border-top: 1px solid #f0f0f0;
  display: flex; gap: 8px;
}
.ai-btn {
  flex: 1; background: #3a7a3a; color: #fff;
  border: none; border-radius: 20px; padding: 10px 0;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.ai-btn:disabled { background: #aaa; cursor: not-allowed; }
.days-select {
  border: 1px solid #ddd; border-radius: 20px; padding: 8px 12px;
  font-size: 13px; background: #f8f8f8; cursor: pointer;
}

/* 留言区 */
.comment-section { padding: 0 0 16px; }
.comment-section-title {
  font-size: 13px; font-weight: 700; color: #888;
  letter-spacing: .5px; margin: 16px 0 8px;
  display: flex; align-items: center; gap: 6px;
}
.comment-section-title::after { content: ''; flex: 1; height: 1px; background: #f0f0f0; }
.comment-card {
  background: #f8f9f8; border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
}
.comment-meta { font-size: 11px; color: #aaa; margin-bottom: 4px; }
.comment-meta b { color: #555; }
.comment-text { font-size: 13px; color: #333; line-height: 1.6; }
.comment-form { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.comment-input {
  border: 1px solid #ddd; border-radius: 10px; padding: 8px 12px;
  font-size: 13px; resize: none; font-family: inherit;
}
.comment-submit {
  align-self: flex-end; background: #3a7a3a; color: #fff;
  border: none; border-radius: 16px; padding: 7px 20px;
  font-size: 13px; cursor: pointer;
}
.login-bar {
  background: #f0f4f0; border-radius: 10px; padding: 10px 14px;
  font-size: 13px; color: #555; display: flex; align-items: center; justify-content: space-between;
}
.login-btn {
  background: #3a7a3a; color: #fff; border: none; border-radius: 12px;
  padding: 5px 14px; font-size: 12px; cursor: pointer;
}

/* AI 行程弹窗 */
.ai-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
}
.ai-modal-overlay.open { display: flex; }
.ai-modal {
  background: #fff; border-radius: 20px 20px 0 0;
  width: 100%; max-width: 480px; max-height: 80vh;
  overflow-y: auto; padding: 20px 20px 40px;
}
.ai-modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #1a2a1a; }
.ai-modal-body { font-size: 13px; line-height: 1.8; color: #333; white-space: pre-wrap; }
.ai-modal-close {
  float: right; background: none; border: none; font-size: 20px;
  cursor: pointer; color: #888; margin-top: -4px;
}

/* 用户名弹窗 */
.username-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 300;
  display: none; align-items: center; justify-content: center;
}
.username-modal-overlay.open { display: flex; }
.username-modal {
  background: #fff; border-radius: 16px; padding: 24px 20px;
  width: 280px; text-align: center;
}
.username-modal h3 { font-size: 16px; margin-bottom: 8px; }
.username-modal p { font-size: 12px; color: #888; margin-bottom: 16px; }
.username-modal input {
  width: 100%; border: 1px solid #ddd; border-radius: 10px;
  padding: 9px 12px; font-size: 14px; margin-bottom: 12px;
  font-family: inherit;
}
.username-modal button {
  width: 100%; background: #3a7a3a; color: #fff; border: none;
  border-radius: 12px; padding: 10px; font-size: 14px; cursor: pointer;
}

</style>
</head>
<body>

<div class="map-wrap" id="mapWrap">

  <!-- 地图背景装饰 -->
  <div class="map-grid"></div>
  <!-- 装饰横路 -->
  <div class="deco-road" style="top:18%;left:0;width:35%;height:6px;opacity:.5;transform:rotate(-3deg)"></div>
  <div class="deco-road" style="top:38%;right:0;width:28%;height:5px;opacity:.4;transform:rotate(5deg)"></div>
  <div class="deco-road" style="top:58%;left:5%;width:30%;height:5px;opacity:.4;transform:rotate(-2deg)"></div>
  <div class="deco-road" style="top:76%;right:5%;width:25%;height:5px;opacity:.4;transform:rotate(3deg)"></div>
  <!-- 装饰水域 -->

  <div style="position:absolute;top:82%;left:10%;width:50px;height:24px;background:rgba(150,190,220,.2);border-radius:50%;transform:rotate(5deg);pointer-events:none"></div>

  <!-- 顶栏 -->
  <div class="topbar">
    <div>
      <div class="topbar-title">🏔 山西好风光</div>
      <div class="topbar-sub">从北往南的旅行地图</div>
    </div>
    <div class="topbar-badge">5座城市</div>
  </div>

  <!-- 路线 -->
  <div class="route-area" id="routeArea">
    <div class="route-line"></div>

    <!-- 大同 -->
    <div class="spacer" style="height:24px"></div>
    <div class="city-row" id="row-datong">
      <div class="city-card" onclick="openDrawer('datong')">
        <div class="card-name name-datong">大同</div>
        <div>
          <span class="card-tag tag-food">🍜 吃</span>

    </div>

    <!-- 忻州 -->
    <div class="city-row right" id="row-xinzhou">
      <div class="city-card" onclick="openDrawer('xinzhou')">

        <div>

          <span class="card-tag tag-play">🏔 游</span>

      </div>

    </div>
    <div class="city-dot dot-taiyuan" style="top:0" onclick="openDrawer('taiyuan')"></div>

    <div class="spacer" style="height:40px;position:relative">

        <div class="card-hint">壶口瀑布 · 小西天 · 飞虹塔</div>

      <div style="flex:1"></div>

    <div class="city-dot dot-linfen" style="top:0" onclick="openDrawer('linfen')"></div>

    <div class="spacer" style="height:80px"></div>

  <!-- 底部图例 -->
  <div class="legend">

      <div class="legend-dot" style="background:#e8754a"></div>大同

    <div class="legend-item" onclick="openDrawer('xinzhou')">
      <div class="legend-dot" style="background:#4a9be8"></div>忻州
    </div>
    <div class="legend-item" onclick="openDrawer('taiyuan')">
      <div class="legend-dot" style="background:#e8b84a"></div>太原
    </div>
    <div class="legend-item" onclick="openDrawer('linfen')">
      <div class="legend-dot" style="background:#7ab84a"></div>临汾

    <div class="legend-item" onclick="openDrawer('yuncheng')">
      <div class="legend-dot" style="background:#e84a6f"></div>运城

  <div class="drawer-header">
    <div class="drawer-icon" id="drawerIcon"></div>

      <div class="drawer-city-name" id="drawerName"></div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>

      <option value="3">3天</option>

    <button class="ai-btn" id="aiBtn" onclick="generateItinerary()">✨ AI生成行程</button>
  </div>
  <div style="padding:0 16px 16px" id="commentSection"></div>
</div>

<script>
const drawerData = {
  datong: {
    name: '大同',
    color: '#e8754a',
    food: [

function openDrawer(cityKey) {
  var city = drawerData[cityKey];
  if (!city) return;
  currentCityKey = cityKey;
  currentCityName = city.name;
  document.getElementById('drawerName').textContent = city.name;
  document.getElementById('drawerName').style.color = city.color;
  var icon = document.getElementById('drawerIcon');
  var icons = { datong: '🏛', xinzhou: '🏔', taiyuan: '🔪', linfen: '💧', yuncheng: '🧂' };
  var bgs   = { datong: '#fff4ef', xinzhou: '#eff6ff', taiyuan: '#fffbef', linfen: '#f5f0ff', yuncheng: '#fff0f4' };
  icon.textContent = icons[cityKey] || '📍';
  icon.style.background = bgs[cityKey] || '#f5f5f5';

  renderDrawerItems(cityKey, city);
  renderComments(cityKey);

  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

// 触摸滑动关闭
var startY = 0;
document.getElementById('drawer').addEventListener('touchstart', function(e) {
  startY = e.touches[0].clientY;
});
document.getElementById('drawer').addEventListener('touchend', function(e) {
  var dy = e.changedTouches[0].clientY - startY;
  if (dy > 80 && this.scrollTop <= 0) closeDrawer();
});
</script>

<!-- AI 行程弹窗 -->
<div class="ai-modal-overlay" id="aiModalOverlay">
  <div class="ai-modal">
    <div><button class="ai-modal-close" onclick="closeAiModal()">✕</button>
    <div class="ai-modal-title" id="aiModalTitle">AI 行程安排</div></div>
    <div class="ai-modal-body" id="aiModalBody">生成中...</div>
  </div>
</div>

<!-- 用户名设置弹窗 -->
<div class="username-modal-overlay" id="usernameModalOverlay">
  <div class="username-modal">
    <h3>起个昵称</h3>
    <p>留言前需要设置昵称，之后可在此页修改</p>
    <input type="text" id="usernameInput" placeholder="你的昵称（最多10字）" maxlength="10">
    <button onclick="saveUsername()">确定</button>
  </div>
</div>

<script>
var WORKER = 'https://shanxi-travel-api.xingqiyi.workers.dev';
var currentCityKey = '';
var currentCityName = '';
var checkedItems = JSON.parse(localStorage.getItem('shanxi_checked') || '{}');
var username = localStorage.getItem('shanxi_username') || '';

function saveUsername() {
  var val = document.getElementById('usernameInput').value.trim();
  if (!val) return;
  username = val;
  localStorage.setItem('shanxi_username', username);
  document.getElementById('usernameModalOverlay').classList.remove('open');
  // 继续留言流程
  document.getElementById('pendingComment') && submitComment();
}

function getCheckedKey(cityKey, section, name) {
  return cityKey + ':' + section + ':' + name;
}

function toggleCheck(cityKey, section, name, el) {
  var key = getCheckedKey(cityKey, section, name);
  if (checkedItems[key]) {
    delete checkedItems[key];
    el.classList.remove('checked');
  } else {
    checkedItems[key] = true;
    el.classList.add('checked');
  }
  localStorage.setItem('shanxi_checked', JSON.stringify(checkedItems));
}

function renderDrawerItems(cityKey, city) {
  var html = '';
  function renderSection(icon, label, items, section) {
    if (!items || !items.length) return '';
    var s = '<div class="drawer-section-title">' + icon + ' ' + label + '</div>';
    items.forEach(function(item) {
      var key = getCheckedKey(cityKey, section, item.name);
      var checked = checkedItems[key] ? ' checked' : '';
      s += '<div class="drawer-item' + checked + '" onclick="toggleCheck('' + cityKey + '','' + section + '','' + item.name.replace(/'/g,"\'") + '',this)">';
      s += '<span class="check-icon">✓</span>';
      s += item.name;
      s += item.note ? '<span class="item-note">' + item.note + '</span>' : '';
      s += '</div>';
    });
    return s;
  }
  html += renderSection('🍜', '吃', city.food, 'food');
  html += renderSection('🗺', '游', city.play, 'play');
  html += renderSection('🏨', '住', city.stay, 'stay');
  html += renderSection('🛍', '买', city.buy, 'buy');
  document.getElementById('drawerBody').innerHTML = html;
}

function renderComments(cityKey) {
  var section = document.getElementById('commentSection');
  section.innerHTML = '<div style="color:#aaa;font-size:12px;padding:8px 0">加载留言中...</div>';
  fetch(WORKER + '/comments?city=' + cityKey)
    .then(function(r){ return r.json(); })
    .then(function(comments) {
      var html = '<div class="comment-section-title">💬 旅行者留言</div>';
      if (comments.length === 0) {
        html += '<div style="color:#bbb;font-size:12px;padding:4px 0 8px">还没有留言，来第一个吧</div>';
      } else {
        comments.forEach(function(c) {
          var t = new Date(c.time);
          var timeStr = (t.getMonth()+1) + '月' + t.getDate() + '日';
          html += '<div class="comment-card"><div class="comment-meta"><b>' + c.username + '</b>  ' + timeStr + '</div><div class="comment-text">' + c.content.replace(/</g,'&lt;') + '</div></div>';
        });
      }
      // 留言表单
      if (username) {
        html += '<div class="comment-form">';
        html += '<textarea class="comment-input" id="commentText" rows="3" placeholder="分享你的旅行经验..."></textarea>';
        html += '<button class="comment-submit" onclick="submitComment()">发布留言</button>';
        html += '</div>';
        html += '<div style="font-size:11px;color:#bbb;margin-top:4px">当前昵称：' + username + '  <span style="color:#3a7a3a;cursor:pointer" onclick="changeUsername()">修改</span></div>';
      } else {
        html += '<div class="login-bar">设置昵称后可以留言<button class="login-btn" onclick="showUsernameModal()">设置昵称</button></div>';
      }
      section.innerHTML = html;
    })
    .catch(function() {
      section.innerHTML = '<div style="color:#f66;font-size:12px">留言加载失败</div>';
    });
}

function showUsernameModal() {
  document.getElementById('usernameModalOverlay').classList.add('open');
  document.getElementById('usernameInput').value = username;
}
function changeUsername() { showUsernameModal(); }

function submitComment() {
  var text = document.getElementById('commentText');
  if (!text || !text.value.trim()) return;
  var content = text.value.trim();
  var btn = document.querySelector('.comment-submit');
  if (btn) btn.disabled = true;
  fetch(WORKER + '/comments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ city: currentCityKey, username: username, content: content })
  }).then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.ok) renderComments(currentCityKey);
      else alert(d.error || '发布失败');
    })
    .catch(function(){ alert('网络错误，请重试'); if (btn) btn.disabled = false; });
}

function generateItinerary() {
  var checked = [];
  var city = drawerData[currentCityKey];
  function collect(items, section) {
    if (!items) return;
    items.forEach(function(item) {
      if (checkedItems[getCheckedKey(currentCityKey, section, item.name)]) {
        checked.push(item.name);
      }
    });
  }
  collect(city.food, 'food');
  collect(city.play, 'play');
  collect(city.stay, 'stay');
  collect(city.buy, 'buy');

  if (checked.length === 0) {
    alert('请先勾选想去的地方和想吃的东西～');
    return;
  }

  var days = document.getElementById('daysSelect').value;
  document.getElementById('aiModalTitle').textContent = currentCityName + ' ' + days + '日行程';
  document.getElementById('aiModalBody').textContent = '🤔 AI正在规划中，请稍候...';
  document.getElementById('aiModalOverlay').classList.add('open');

  var btn = document.getElementById('aiBtn');
  btn.disabled = true;

  fetch(WORKER + '/ai/itinerary', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ city: currentCityName, items: checked, days: parseInt(days) })
  }).then(function(r){ return r.json(); })
    .then(function(d) {
      btn.disabled = false;
      if (d.ok) {
        document.getElementById('aiModalBody').textContent = d.itinerary;
      } else {
        document.getElementById('aiModalBody').textContent = '生成失败：' + (d.error || '未知错误');
      }
    })
    .catch(function(e) {
      btn.disabled = false;
      document.getElementById('aiModalBody').textContent = '网络错误，请重试';
    });
}

function closeAiModal() {
  document.getElementById('aiModalOverlay').classList.remove('open');
}
</script>

</body>
